# dsh-quick-restart bundle patch: inserts the sidebar restart entry into the web
# profile roster. The browser half renders one button in the sidebar footer and
# talks to the plugin's own same-origin endpoints; the host half owns those
# endpoints and writes the restart-request marker the restart keeper watches.
- insert:
    - id: ui-quick-restart
      name: '@captain1275/dsh-quick-restart'
      config:
        # The checkout that owns dsh-restart.request / dsh-restart-agent.log and
        # the launcher family. Change this if the checkout moves.
        repoRoot: C:\Users\19161\deepseek-harness-next
