# dsh-bilibili-download bundle patch: inserts the dual-face plugin row into
# the web profile roster. The node half (exports ".") runs in the host process
# (yt-dlp subprocess + /api/dsh-bilibili-download routes); the dsh.client
# declaration in package.json makes the browser half (exports "./client")
# load in the web GUI.
- insert:
    - id: ui-bilibili-download
      name: '@captain1275/dsh-bilibili-download'